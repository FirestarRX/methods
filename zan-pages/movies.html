<script src="https://kit.fontawesome.com/424b17ee5b.js" crossorigin="anonymous"></script>
<script>
  function renderGames(containerId, games) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card game-thumb";
      card.innerHTML = `
        <img src="${game.thumbnail}" alt="${game.name}">
        <div class="overlay">
          <button class="play-button">
            <i class="fa-solid fa-play"></i> Play
          </button>
        </div>
        <span>${game.name}</span>
      `;
      card.addEventListener("click", () => openGame(game));
      container.appendChild(card);
    });
  }
  function derenderGames(sectionId) {
    const container = document.getElementById(sectionId);
    if (container) container.innerHTML = "";
  }
</script>

<div class="game-player hidden" id="gamePlayer">
    <div class="player-header">
      <button id="closeGame" class="player-button"><i class="fa-solid fa-xmark"></i></button>
      <button id="fullscreenGame" class="player-button"><i class="fa-solid fa-expand"></i></button>
      <span id="gameTitle"></span>
    </div>
    <embed id="gameEmbed" src="" width="100%" height="100%" />

  </div>
<div class="games-container">
  <!-- MAIN GAME LIBRARY -->
  <section id="mainLibrary" class="active-section">
    <h1>Games Library</h1>
    <p class="subtitle">Browse through categories and find your next favorite game!</p>

    <div class="search-bar">
        <input type="text" id="gameSearch" placeholder="Search games..." />
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <!-- Game Sections -->
    <div class="game-grid" id="allGames"></div>
    <script>
        const allGames = [
            {
            name: "Interstellar",
            embedUrl: "https://embed.cinevo.site/movie/157336",
            thumbnail: "https://firestarrx.github.io/MethodsEmbeds/img/Interstellar.jpg"
            }
        ]
        allGames.sort((a, b) => a.name.localeCompare(b.name))
        renderGames("allGames", allGames);
    </script>
</div>

<style>
  body {
    background-color: #1e1e2e;
    color: #cdd6f4;
    font-family: "Inter", "Segoe UI", sans-serif;
  }
  .hidden { display: none; }
  .games-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }
  .game-player {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.95);
    display: flex;
    flex-direction: column;
    z-index: 1000;
  }
  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #11111b;
    color: #cdd6f4;
    border-bottom: 1px solid #313244;
  }

  h1 {
    color: #cba6f7;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    color: #a6adc8;
    margin-bottom: 1.5rem;
  }

  .section-title {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: white;
  }

  .section-desc {
    font-size: 1rem;
    margin-bottom: 1.5rem;
    color: #cdd6f4;
  }

  .search-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    background: #1e1e2e;
    padding: 10px 0;
    margin-bottom: 2rem;
    border-bottom: 1px solid #313244;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  .search-bar input {
    width: 100%;
    background: #181825;
    border: 1px solid #313244;
    border-radius: 8px;
    padding: 10px 40px 10px 15px;
    color: #cdd6f4;
    font-size: 1rem;
    outline: none;
    transition: border 0.3s;
  }

  .search-bar input:focus {
    border-color: #cba6f7;
  }

  .search-bar i {
    position: absolute;
    right: 20px;
    color: #a6adc8;
    font-size: 1.1rem;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
  }

  .game-card {
    background: #181825;
    border: 1px solid #313244;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    color: #cdd6f4;
    font-weight: 500;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .game-card:hover {
    border-color: #cba6f7;
    transform: translateY(-3px);
  }

  .game-thumb img {
    width: 100%;
    border-radius: 8px;
    display: block;
  }

  .game-section h2 {
    color: white;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .game-thumb:hover .overlay {
    opacity: 1;
  }

  .play-button {
    background: #cba6f7;
    border: none;
    color: #1e1e2e;
    font-weight: bold;
    border-radius: 6px;
    padding: 10px 15px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
  }

  .play-button:hover {
    background: #b4befe;
  }

  .game-card span {
    display: block;
    margin-top: 0.5rem;
    color: #cdd6f4;
  }

  .details-section {
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
  }

  .details-section.active-section {
    opacity: 1;
    transform: translateY(0);
  }

  .backButton {
    background: #181825;
    color: #cdd6f4;
    border: 1px solid #313244;
    border-radius: 8px;
    padding: 8px 15px;
    margin-bottom: 1rem;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s;
  }

  .backButton:hover {
    background: #313244;
    border-color: #cba6f7;
  }

  .player-button {
    background: #cba6f7;
    border: none;
    color: #1e1e2e;
    font-weight: bold;
    border-radius: 6px;
    padding: 10px 15px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s;
  }

  .player-button:hover {
    background: #b4befe;
  }

  .hidden {
    display: none;
  }

  .active-section {
    display: block;
  }
</style>

<script>
  const player = document.getElementById("gamePlayer");
  const embed = document.getElementById("gameEmbed");
  const title = document.getElementById("gameTitle");
  const closeGame = document.getElementById("closeGame");
  const fullscreenGame = document.getElementById("fullscreenGame");

  const searchInput = document.getElementById("gameSearch");
  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    document.querySelectorAll("#allGames .game-card").forEach(card => {
      const name = card.textContent.toLowerCase();
      card.style.display = name.includes(query) ? "block" : "none";
    });
  });

  const mainLibrary = document.getElementById("mainLibrary");
  const detailSections = document.querySelectorAll(".details-section");

  function openGame(game) {
    embed.src = game.embedUrl;
    title.textContent = game.name;
    player.classList.remove("hidden");
  }
  closeGame.addEventListener("click", () => {
    embed.src = "about:blank";
    embed.srcdoc = "";
    player.classList.add("hidden");
  });
  fullscreenGame.addEventListener("click", () => {
    embed.requestFullscreen();
  });

  document.querySelectorAll(".game-card[data-target]").forEach(card => {
    card.addEventListener("click", () => {
      const targetId = card.dataset.target;
      const targetSection = document.getElementById(targetId);

      if (targetSection) {
        mainLibrary.classList.remove("active-section");
        mainLibrary.classList.add("hidden");

        detailSections.forEach(sec => sec.classList.add("hidden"));
        targetSection.classList.remove("hidden");
        requestAnimationFrame(() => targetSection.classList.add("active-section"));
      }
    });
  });

  document.querySelectorAll(".backButton").forEach(button => {
    button.addEventListener("click", () => {
      detailSections.forEach(sec => {
        sec.classList.remove("active-section");
        sec.classList.add("hidden");
      });
      mainLibrary.classList.remove("hidden");
      requestAnimationFrame(() => mainLibrary.classList.add("active-section"));
    });
  });
</script>
