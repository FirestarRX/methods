<script src="https://kit.fontawesome.com/424b17ee5b.js" crossorigin="anonymous"></script>

<!-- ===================== PLAYER ===================== -->
<div class="game-player hidden" id="gamePlayer">
  <div class="player-header">
    <button id="closeGame" class="player-button">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button id="fullscreenGame" class="player-button">
      <i class="fa-solid fa-expand"></i>
    </button>
    <span id="gameTitle"></span>
  </div>
  <embed id="gameEmbed" src="" width="100%" height="100%" />
</div>

<!-- ===================== APP ===================== -->
<div class="games-container">

  <!-- ===== MAIN LIBRARY ===== -->
  <section id="mainLibrary" class="active-section">
    <h1>Games Library</h1>
    <p class="subtitle">Browse shows!</p>

    <div class="search-bar">
      <input type="text" id="gameSearch" placeholder="Search shows..." />
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <div class="game-grid">
      <div class="game-card" data-target="animeSection">
        <span>Anime</span>
      </div>
    </div>
  </section>

  <!-- ===== ANIME CATEGORY ===== -->
  <section id="animeSection" class="details-section hidden">
    <button class="backButton">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>

    <h2 class="section-title">Anime</h2>
    <p class="section-desc">What a weeb!</p>

    <div class="game-grid" id="animeGrid"></div>
  </section>

  <!-- ===== SONIC CATEGORY ===== -->
  <section id="sonicSection" class="details-section hidden">
    <button class="backButton">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>

    <h2 class="section-title">Sonic</h2>
    <p class="section-desc">Gotta go fast</p>

    <div class="game-grid" id="sonicGrid"></div>
  </section>

</div>

<!-- ===================== STYLES ===================== -->
<style>
  body {
    background-color: #1e1e2e;
    color: #cdd6f4;
    font-family: "Inter", "Segoe UI", sans-serif;
  }
  .hidden { display: none; }
  .active-section { display: block; }

  .games-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }

  .game-player {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.95);
    display: flex;
    flex-direction: column;
    z-index: 1000;
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    padding: 10px 15px;
    background: #11111b;
    border-bottom: 1px solid #313244;
  }

  .search-bar {
    display: flex;
    position: relative;
    margin-bottom: 2rem;
  }

  .search-bar input {
    width: 100%;
    background: #181825;
    border: 1px solid #313244;
    border-radius: 8px;
    padding: 10px 40px 10px 15px;
    color: #cdd6f4;
  }

  .search-bar i {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
  }

  .game-card {
    background: #181825;
    border: 1px solid #313244;
    border-radius: 10px;
    padding: 1rem;
    cursor: pointer;
    text-align: center;
    transition: 0.3s;
  }

  .game-card:hover {
    border-color: #cba6f7;
    transform: translateY(-3px);
  }

  .game-thumb img {
    width: 100%;
    border-radius: 8px;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    transition: 0.3s;
  }

  .game-thumb:hover .overlay {
    opacity: 1;
  }

  .play-button {
    background: #cba6f7;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
  }

  .backButton, .player-button {
    background: #cba6f7;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .details-section {
    opacity: 0;
    transform: translateY(20px);
    transition: 0.4s ease;
  }

  .details-section.active-section {
    opacity: 1;
    transform: translateY(0);
  }
</style>

<!-- ===================== SCRIPT ===================== -->
<script>
  const player = document.getElementById("gamePlayer");
  const embed = document.getElementById("gameEmbed");
  const title = document.getElementById("gameTitle");

  const mainLibrary = document.getElementById("mainLibrary");
  const detailSections = document.querySelectorAll(".details-section");

  function renderGames(containerId, items) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "game-card game-thumb";

      card.innerHTML = `
        <img src="${item.thumbnail}">
        <div class="overlay">
          <button class="play-button">
            <i class="fa-solid ${item.type === "category" ? "fa-folder-open" : "fa-play"}"></i>
            ${item.type === "category" ? "Open" : "Play"}
          </button>
        </div>
        <span>${item.name}</span>
      `;

      if (item.type === "category") {
        card.onclick = () => openCategory(item.target);
      } else {
        card.onclick = () => openGame(item);
      }

      container.appendChild(card);
    });
  }

  function openCategory(sectionId) {
    mainLibrary.classList.add("hidden");
    detailSections.forEach(s => s.classList.add("hidden"));

    const section = document.getElementById(sectionId);
    section.classList.remove("hidden");

    requestAnimationFrame(() => {
      section.classList.add("active-section");
    });
  }

  function openGame(game) {
    embed.src = game.embedUrl;
    title.textContent = game.name;
    player.classList.remove("hidden");
  }

  document.getElementById("closeGame").onclick = () => {
    embed.src = "about:blank";
    player.classList.add("hidden");
  };

  document.getElementById("fullscreenGame").onclick = () => {
    embed.requestFullscreen();
  };

  document.querySelectorAll(".game-card[data-target]").forEach(card => {
    card.onclick = () => openCategory(card.dataset.target);
  });

  document.querySelectorAll(".backButton").forEach(btn => {
    btn.onclick = () => {
      detailSections.forEach(s => s.classList.remove("active-section"));
      detailSections.forEach(s => s.classList.add("hidden"));

      mainLibrary.classList.remove("hidden");
      requestAnimationFrame(() => mainLibrary.classList.add("active-section"));
    };
  });

  /* ===== DATA ===== */

  const animeCategories = [
    {
      name: "Sonic",
      thumbnail: "https://firestarrx.github.io/MethodsEmbeds/img/SonicCD.png",
      type: "category",
      target: "sonicSection"
    }
  ];

  const sonicGames = [
    {
      name: "Sonic CD",
      thumbnail: "https://firestarrx.github.io/MethodsEmbeds/img/SonicCD.png",
      embedUrl: "https://firestarrx.github.io/MethodsEmbeds/SonicCD.html"
    },
    {
      name: "Sonic Mania",
      thumbnail: "https://firestarrx.github.io/MethodsEmbeds/img/SonicM.png",
      embedUrl: "https://firestarrx.github.io/MethodsEmbeds/SonicM.html"
    }
  ];

  renderGames("animeGrid", animeCategories);
  renderGames("sonicGrid", sonicGames);
</script>
