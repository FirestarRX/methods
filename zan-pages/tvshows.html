<script>
  function renderGames(containerId, games) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    games.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card game-thumb";
      card.innerHTML = `
        <img src="${game.thumbnail}" alt="${game.name}">
        <div class="overlay">
          <button class="play-button">
            <i class="fa-solid fa-play"></i> Play
          </button>
        </div>
        <span>${game.name}</span>
      `;
      
      if (game.target) {
        card.onclick = () => openCategory(game.target);
      } 
      else if (game.seasons) {
        card.onclick = () => openShow(game);
      } 
      else if (game.embedUrl) {
        card.onclick = () => openGame(game);
      }
      container.appendChild(card);
    });
  }
  function derenderGames(sectionId) {
    const container = document.getElementById(sectionId);
    if (container) container.innerHTML = "";
  }
  function renderSeasons(show) {
    const seasonsEl = document.getElementById("seasonList");
    seasonsEl.innerHTML = "";

    show.seasons.forEach((season, index) => {
        const btn = document.createElement("div");
        btn.className = "season-button";
        btn.textContent = season.name;

        btn.onclick = () => renderEpisodes(season);
        seasonsEl.appendChild(btn);

        if (index === 0) renderEpisodes(season);
    });
  }
  function renderEpisodes(season) {
    const list = document.getElementById("episodeList");
    list.innerHTML = "";

    season.episodes.forEach(ep => {
        const btn = document.createElement("div");
        btn.className = "episode-button";

        btn.innerHTML = `
            <img src="${ep.thumbnail}" alt="${ep.title}" class="episode-thumb">
            <div class="episode-info">
                <span class="episode-title">${ep.number}. ${ep.title}</span>
                <span class="duration">${ep.duration}</span>
            </div>
        `;

        btn.onclick = () => openGame(ep);
        list.appendChild(btn);
    });
  }




</script>

<div class="game-player hidden" id="gamePlayer">

<script>
  const player = document.getElementById("gamePlayer");
  const embed = document.getElementById("gameEmbed");
  const title = document.getElementById("gameTitle");
  const closeGame = document.getElementById("closeGame");
  const fullscreenGame = document.getElementById("fullscreenGame");

  const searchInput = document.getElementById("gameSearch");
  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    document.querySelectorAll(".game-card").forEach(card => {
      const name = card.textContent.toLowerCase();
      card.style.display = name.includes(query) ? "block" : "none";
    });
  });

  const mainLibrary = document.getElementById("mainLibrary");
  const detailSections = document.querySelectorAll(".details-section");

  function openGame(game) {
    embed.src = game.embedUrl;
    title.textContent = game.name;
    player.classList.remove("hidden");
  }
  closeGame.addEventListener("click", () => {
    embed.src = "about:blank";
    embed.srcdoc = "";
    player.classList.add("hidden");
  });
  fullscreenGame.addEventListener("click", () => {
    embed.requestFullscreen();
  });

  function openCategory(sectionId) {
    document.getElementById("mainLibrary").classList.add("hidden");

    const section = document.getElementById(sectionId);
    section.classList.remove("hidden");

    requestAnimationFrame(() => {
        section.classList.add("active-section");
    });
  }
    function openShow(show) {
        // Hide main library
        mainLibrary.classList.add("hidden");
        mainLibrary.classList.remove("active-section");

        // Hide all other detail sections except episode view
        detailSections.forEach(sec => {
            if (sec.id !== "episodeView") {
                sec.classList.add("hidden");
                sec.classList.remove("active-section");
            }
        });

        // Set the title
        document.getElementById("showTitle").textContent = show.name;

        // Show episode view
        const episodeSection = document.getElementById("episodeView");
        episodeSection.classList.remove("hidden");
        requestAnimationFrame(() => {
            episodeSection.classList.add("active-section");
        });

        // Render seasons
        renderSeasons(show);
    }



  document.querySelectorAll(".game-card[data-target]").forEach(card => {
    card.addEventListener("click", () => {
      const targetId = card.dataset.target;
      const targetSection = document.getElementById(targetId);

      if (targetSection) {
        mainLibrary.classList.remove("active-section");
        mainLibrary.classList.add("hidden");

        detailSections.forEach(sec => sec.classList.add("hidden"));
        targetSection.classList.remove("hidden");
        requestAnimationFrame(() => targetSection.classList.add("active-section"));
      }
    });
  });

  document.querySelectorAll(".backButton").forEach(button => {
    button.addEventListener("click", () => {
      detailSections.forEach(sec => {
        sec.classList.remove("active-section");
        sec.classList.add("hidden");
      });
      mainLibrary.classList.remove("hidden");
      requestAnimationFrame(() => mainLibrary.classList.add("active-section"));
    });
  });
</script>
