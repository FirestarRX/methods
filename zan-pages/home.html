<script>
// Logic preserved 100%, DOM output updated for Tailwind

const schoolList = ["deledao", "goguardian", "lightspeed", "linewize", "securly", ".edu/"];
function isBlockedDomain(url) {
    try {
        const domain = new URL(url, location.origin).hostname + "/";
        return schoolList.some(school => domain.includes(school));
    } catch(e) { return false; }
}
const originalFetch = window.fetch;
window.fetch = function(url, options) {
    if (isBlockedDomain(url)) return Promise.reject(new Error("Blocked"));
    return originalFetch.apply(this, arguments);
};
const originalOpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url) {
    if (isBlockedDomain(url)) return;
    return originalOpen.apply(this, arguments);
};
HTMLCanvasElement.prototype.toDataURL = function(...args) { return ""; };

const CONFIG = {
    zones: "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    covers: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main",
    html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main",
    stats: "https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files?period="
};
let state = {
    games: [],
    hits: {},
    theme: 'modern',
    categories: []
};

async function init() {
    try {
        const zonesRes = await fetch(CONFIG.zones + "?t=" + Date.now());
        state.games = await zonesRes.json();
        state.games[0].featured = true;
        extractCategories();
        renderApp();
        
        const search = new URLSearchParams(window.location.search);
        if (search.get('id')) {
            const zone = state.games.find(z => z.id + '' === search.get('id'));
            if (zone) openGame(zone.id);
        }
        
        ['day', 'week', 'month', 'quarter', 'year'].forEach(fetchAllStats);
        getAllStats();
    } catch (e) {
        document.body.innerHTML = "<div class='h-screen flex items-center justify-center text-red-500 text-xl font-bold'>Failed to load resources. Check connection.</div>";
    }
}

async function fetchAllStats(period) {
    if (!state.hits[period]) state.hits[period] = {};
    let page = 1, hasMore = true;
    while (hasMore) {
        try {
            const res = await fetch(`${CONFIG.stats}${period}&page=${page}`);
            const data = await res.json();
            if (!data || data.length === 0) hasMore = false;
            else {
                data.forEach(f => {
                    const match = f.name.match(/\/(\d+)\.html/);
                    if (match) {
                        const id = match[1];
                        if (!state.hits[period][id]) state.hits[period][id] = 0;
                        state.hits[period][id] += f.hits.total;
                    }
                });
                page++;
                if (page === 2) updatePlayCounts();
            }
        } catch (e) { hasMore = false; }
    }
    updatePlayCounts();
    if (period === 'week') {
        updateTrendingWeek();
        updateTagSections();
    }
}

function getCardHTML(g, extraClasses = "") {
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const isFav = favorites.includes(g.id);
    const cover = resolveUrl(g.cover);
    const tags = (g.special || g.tags || []).slice(0, 2).map(toTitleCase).join(', ') || 'Game';
    
    return `
    <div class="group flex flex-col bg-card rounded-xl border border-white/5 hover:border-primary/50 overflow-hidden cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-primary/20 ${extraClasses}" onclick="openGame(${g.id})">
        <div class="relative aspect-square overflow-hidden bg-white/5">
            <button class="absolute top-2 right-2 z-10 p-2 text-white/50 hover:text-yellow-400 hover:scale-110 transition-all ${isFav ? 'text-yellow-400' : ''}" onclick="event.stopPropagation(); toggleFavorite(${g.id}, this)">

function updateTrendingWeek() {
    const trendingWeek = [...state.games].sort((a,b) => getScore(b, 'week') - getScore(a, 'week')).slice(0, 15);
    const el = document.getElementById('trendingWrapper');
    if (el) el.innerHTML = trendingWeek.map(g => `<div class="swiper-slide px-2">${getCardHTML(g)}</div>`).join('');
}

function updateTagSections() {
    for (let i = 0; i < (state.tagCount || 0); i++) {
        const wrapperEl = document.getElementById(`tagWrapper${i}`);
        if (wrapperEl) {
            wrapperEl.querySelectorAll('.stat-row').forEach(row => {
                const gameId = parseInt(row.dataset.id);
                const game = state.games.find(g => g.id === gameId);
                if (game) row.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-primary"></span> ${formatPlays(getScore(game, 'week'))} Plays`;
            });
        }
    }
}

function updatePlayCounts() {
    document.querySelectorAll('.stat-row').forEach(async el => {
        const id = el.dataset.id;
        if(id) {
            const plays = await getStats(id);
            el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-primary"></span> ${formatPlays(plays)} Plays`;
        }
    });
}

function extractCategories() {
    const catSet = new Set();
    state.games.forEach(g => { if (g.special && Array.isArray(g.special)) g.special.forEach(s => catSet.add(s)); });
    state.categories = Array.from(catSet).sort();
}

function getScore(game, period) { return state.hits[period]?.[game.id] || 0; }
function formatPlays(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'm';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num.toString();
}
function resolveUrl(u) { return u.replace("{COVER_URL}", CONFIG.covers).replace("{HTML_URL}", CONFIG.html); }
function toTitleCase(str) { return str.replace(/\w\S*/g, text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()); }

function renderTagSections() {
    const allTags = new Set();
    state.games.forEach(game => { if (game.tags && Array.isArray(game.tags)) game.tags.forEach(tag => allTags.add(tag)); });
    
    const tagsArray = Array.from(allTags);
    if (tagsArray.length === 0) return 0;
    
    const selectedTags = tagsArray.sort(() => Math.random() - 0.5).slice(0, 3);
    const container = document.getElementById('tagSections');
    
    container.innerHTML = selectedTags.map((tag, index) => `
        <section>
            <div class="flex items-center gap-3 mb-6">
                <div class="w-1.5 h-6 bg-primary rounded-full"></div>
                <h2 class="text-2xl font-bold text-text">${tag} Games</h2>
            </div>
            <div class="swiper horizontal-list" id="tagSwiper${index}">
                <div class="swiper-wrapper py-4" id="tagWrapper${index}"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </section>
    `).join('');
    
    selectedTags.forEach((tag, index) => {
        const tagGames = state.games.filter(g => g.tags && g.tags.includes(tag)).slice(0, 15);
        if (tagGames.length > 0) {
            document.getElementById(`tagWrapper${index}`).innerHTML = tagGames.map(g => `
                <div class="swiper-slide px-2">${getCardHTML(g)}</div>
            `).join('');
        }
    });
    return selectedTags.length;
}

function renderApp() {
    if (localStorage.getItem('theme') === 'classic') toggleTheme(true);
    renderNavCategories();
    
    const popular = state.games.filter(g => (g.featured || g.special?.includes('popular')) && !g.special?.includes('tools'));
    const ports = state.games.filter(g => g.special?.includes('port') && !g.special?.includes('tools'));
    const randomGames = [state.games[Math.floor(Math.random() * state.games.length)], state.games[Math.floor(Math.random() * state.games.length)]].filter(g => !g.special?.includes('tools'));
    const featured = [popular[Math.floor(Math.random() * popular.length)], ...randomGames, ports.length > 0 ? ports[Math.floor(Math.random() * ports.length)] : popular[1], popular[0]].filter(Boolean).slice(0, 5);
    
    renderHero(featured);
    renderSwiper('trendingWrapper', state.games.slice(0, 15));
    state.tagCount = renderTagSections() || 0;
    
    renderGrid('featuredGrid', state.games.filter(g => g.featured));
    renderGrid('allGamesGrid', [...state.games].sort((a, b) => a.id - b.id));
    renderClassicGrid();
    initSwipers();
}

function renderNavCategories() {
    const navContent = document.getElementById('navContent');
    let html = `<button class="nav-link px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap bg-primary text-white" onclick="switchView('all', this)">All Games</button>`;
    html += `<button class="nav-link px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap bg-card text-muted hover:bg-cardHover hover:text-white" onclick="filterFavorites(this)">⭐ Favorites</button>`;
    
    state.categories.forEach(cat => {
        html += `<button class="nav-link px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap bg-card text-muted hover:bg-cardHover hover:text-white" onclick="filterByCategory('${cat}', this)">${toTitleCase(cat)}</button>`;
    });

    document.querySelectorAll('.nav-link').forEach(l => {
        l.classList.remove('bg-primary', 'text-white');
        l.classList.add('bg-card', 'text-muted');
    });
    if(btn) {

        btn.classList.add('bg-primary', 'text-white');
    }

function filterFavorites(btn) {
    updateNavActive(btn);
    const s = document.getElementById('searchView'), m = document.getElementById('modernView'), c = document.getElementById('classicView');
    m.classList.add('hidden'); c.classList.add('hidden'); s.classList.remove('hidden');
    document.getElementById('searchBar').value = "";
    
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const hits = state.games.filter(g => favorites.includes(g.id));
    
    document.getElementById('searchResults').innerHTML = hits.length ? hits.map(g => getCardHTML(g)).join('') : '<p class="col-span-full text-center py-12 text-muted">No favorites yet. Star some games!</p>';
}

function toggleFavorite(id, btnElement) {
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const index = favorites.indexOf(id);
    const svg = btnElement.querySelector('svg');
    
    if (index > -1) {
        favorites.splice(index, 1);
        btnElement.classList.remove('text-yellow-400');
        svg.setAttribute('fill', 'none');
        
        // Remove from view if in favorites view
        const isFavView = document.getElementById('searchView').querySelector('h2').textContent.includes('Favorites');
        if(isFavView) {
            const card = btnElement.closest('.group');
            card.style.opacity = '0';
            setTimeout(() => card.remove(), 300);
        }
    } else {
        favorites.push(id);
        btnElement.classList.add('text-yellow-400');
        svg.setAttribute('fill', 'currentColor');
    }
    localStorage.setItem('favorites', JSON.stringify(favorites));
}

function sortZones() {
    const sortBy = document.getElementById('sortOptions').value;
    let sortedGames = [...state.games];
    if (sortBy === 'name') sortedGames.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') sortedGames.sort((a, b) => b.id - a.id);
    else if (sortBy === 'popular') sortedGames.sort((a, b) => getScore(b, 'year') - getScore(a, 'year'));
    renderGrid('allGamesGrid', sortedGames);

let heroSwiper, trendingSwiper;
function initSwipers() {
    if (heroSwiper) heroSwiper.destroy(true, true);
    heroSwiper = new Swiper('.featured-slider', {
        loop: true, observer: true, observeParents: true,
        autoplay: { delay: 5000, disableOnInteraction: false },
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: { nextEl: '.featured-slider .swiper-button-next', prevEl: '.featured-slider .swiper-button-prev' },
        effect: 'fade', fadeEffect: { crossFade: true }, speed: 800
    });

    const commonSwiperSettings = {
        slidesPerView: 2, spaceBetween: 10,
        observer: true, observeParents: true, slidesPerGroup: 2, speed: 600,
        breakpoints: {
            640: { slidesPerView: 3, slidesPerGroup: 3 },
            768: { slidesPerView: 4, slidesPerGroup: 4 },
            1024: { slidesPerView: 5, slidesPerGroup: 5 },
            1280: { slidesPerView: 6, slidesPerGroup: 6 }
        }
    };

    if (trendingSwiper) trendingSwiper.destroy(true, true);
    trendingSwiper = new Swiper('#trendingSwiper', {
        ...commonSwiperSettings,
        navigation: { nextEl: '#trendingSwiper .swiper-button-next', prevEl: '#trendingSwiper .swiper-button-prev' }
    });
    
    for (let i = 0; i < (state.tagCount || 0); i++) {
        const swiperEl = document.getElementById(`tagSwiper${i}`);
        if (swiperEl) {
            new Swiper(`#tagSwiper${i}`, {
                ...commonSwiperSettings,

function handleSearch(q) {
    const s = document.getElementById('searchView'), m = document.getElementById('modernView'), c = document.getElementById('classicView');
    const r = document.getElementById('searchResults');
    
    if (!q) {
        s.classList.add('hidden');
        if (state.theme === 'classic') c.classList.remove('hidden'); else m.classList.remove('hidden');
        document.querySelector('#searchView h2').textContent = 'Search Results';
        return;
    }
    
    m.classList.add('hidden'); c.classList.add('hidden'); s.classList.remove('hidden');
    document.querySelector('#searchView h2').textContent = `Search Results for "${q}"`;
    updateNavActive(null); // Clear nav pills
    
    const hits = state.games.filter(g => g.name.toLowerCase().includes(q.toLowerCase()));
    r.innerHTML = hits.length ? hits.map(g => getCardHTML(g)).join('') : '<p class="col-span-full text-center py-12 text-muted">No games found.</p>';
}

function filterByCategory(cat, btn) {

    const hits = state.games.filter(g => g.special && g.special.includes(cat));

}

async function openGame(id) {
    const g = state.games.find(x => x.id === id);
    if (!g) return;
    
    const stats = JSON.parse(localStorage.getItem('userStats') || '{"opens": {}, "timeStart": null}');
    stats.opens[id] = (stats.opens[id] || 0) + 1;
    stats.timeStart = Date.now();
    localStorage.setItem('userStats', JSON.stringify(stats));
    
    document.getElementById('zoneName').textContent = g.name;
    document.getElementById('zoneId').textContent = id;
    document.getElementById('zoneAuthor').textContent = "by " + (g.author || "Unknown");
    document.getElementById('zoneAuthor').href = g.authorLink || "#";
    
    const v = document.getElementById('zoneViewer');
    const f = document.getElementById('zoneFrame');
    
    document.body.style.overflow = 'hidden';
    v.classList.remove('hidden');
    // slight delay for animation
    setTimeout(() => v.classList.remove('translate-y-full'), 10);
    
    // REMOVED URL ROUTING HERE
    
    if (g.url.startsWith('http') && !g.url.includes('{')) {
        window.open(g.url, '_blank');
        closeZone();
        return;
    }
    
    try {
        const u = resolveUrl(g.url);
        const r = await fetch(u + "?t=" + Date.now());
        const h = await r.text();
        f.contentDocument.open();
        f.contentDocument.write(h);
        f.contentDocument.close();
    } catch(e) {
        alert("Load failed");
        closeZone();
    }
}

function closeZone() {
    const stats = JSON.parse(localStorage.getItem('userStats') || '{"opens": {}, "timeStart": null, "totalTime": 0}');
    if (stats.timeStart) {
        stats.totalTime = (stats.totalTime || 0) + (Date.now() - stats.timeStart);
        stats.timeStart = null;
        localStorage.setItem('userStats', JSON.stringify(stats));
    }
    
    const v = document.getElementById('zoneViewer');
    v.classList.add('translate-y-full');
    setTimeout(() => {
        v.classList.add('hidden');
        document.getElementById('zoneFrame').src = '';
        document.body.style.overflow = '';
    }, 300);
    
    // REMOVED URL ROUTING HERE
}

function fullscreenZone() {
    const f = document.getElementById('zoneFrame');
    if (f.requestFullscreen) f.requestFullscreen();
}

function aboutBlank() {
    const id = document.getElementById('zoneId').textContent;
    const g = state.games.find(x => x.id == id);
    if (!g) return;
    const w = window.open('about:blank', '_blank');
    const u = resolveUrl(g.url);
    fetch(u).then(r=>r.text()).then(h => {
        const baseUrl = u.substring(0, u.lastIndexOf('/') + 1);
        const htmlWithBase = h.replace('<head>', `<head><base href="${baseUrl}">`);
        w.document.open();
        w.document.write(htmlWithBase);
        w.document.close();
    });
}

function downloadZone() {
    const id = document.getElementById('zoneId').textContent;
    const g = state.games.find(x => x.id == id);
    const u = resolveUrl(g.url);
    fetch(u).then(r=>r.text()).then(t => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([t], {type: "text/html"}));
        a.download = g.name + ".html";
        a.click();
    });
}

function applyCustomColors() {
    const primary = localStorage.getItem('primaryColor');
    const bg = localStorage.getItem('bgColor');
    const cardBg = localStorage.getItem('cardBgColor');
    const text = localStorage.getItem('textColor');
    
    if (primary) {
        document.documentElement.style.setProperty('--primary', primary);
        // auto-generate hover
        const num = parseInt(primary.replace('#', ''), 16);
        const R = Math.max(0, (num >> 16) - 20), G = Math.max(0, (num >> 8 & 0x00FF) - 20), B = Math.max(0, (num & 0x0000FF) - 20);
        document.documentElement.style.setProperty('--primary-hover', '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1));
    }
    if (bg) document.documentElement.style.setProperty('--bg-main', bg);
    if (cardBg) document.documentElement.style.setProperty('--bg-card', cardBg);
    if (text) document.documentElement.style.setProperty('--text-main', text);
}

function resetCustomColors() {
    ['primaryColor', 'bgColor', 'cardBgColor', 'textColor'].forEach(k => localStorage.removeItem(k));
    document.documentElement.style.removeProperty('--primary');
    document.documentElement.style.removeProperty('--bg-main');
    document.documentElement.style.removeProperty('--bg-card');
    document.documentElement.style.removeProperty('--text-main');

}

// Keep all original Data Export/Import, Stats cache, Cloaking logic exact
let _allStatsCache = null; let _statsFetchPromise = null;
function loadCachedStats() {
    try {
        const cached = localStorage.getItem('statsCache_v2'); if (!cached) return null;
        const data = JSON.parse(cached); const now = Date.now(); const oneHour = 60 * 60 * 1000;
        if (!data.timestamp || !data.stats || (now - data.timestamp) > oneHour || Object.keys(data.stats).length < 100) {
            localStorage.removeItem('statsCache_v2'); return null;
        }
        return data.stats;
    } catch (e) { localStorage.removeItem('statsCache_v2'); return null; }
}

function saveCachedStats(stats) {
    try { localStorage.setItem('statsCache_v2', JSON.stringify({ timestamp: Date.now(), stats: stats })); } 
    catch (e) { console.error('Failed to cache stats:', e); }
}

async function getAllStats(forceRefresh = false) {
    if (!forceRefresh && _allStatsCache) return _allStatsCache;
    if (!forceRefresh) { const cached = loadCachedStats(); if (cached) return _allStatsCache = cached; }
    if (_statsFetchPromise) return _statsFetchPromise;
    
    _statsFetchPromise = (async () => {
        const BASE_URL = 'https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files';
        const combinedMap = Object.create(null); let page = 1; let consecutiveEmpty = 0;
        
        while (consecutiveEmpty < 2) {
            const pages = Array.from({ length: 10 }, (_, i) => page + i);
            const responses = await Promise.all(pages.map(p => fetch(`${BASE_URL}?period=year&page=${p}&limit=100`).then(r => r.ok ? r.json() : []).catch(() => [])));
            let foundData = false;
            for (const data of responses) {
                if (!Array.isArray(data) || data.length === 0) continue;
                foundData = true;
                for (const item of data) {
                    if (!item?.name) continue;
                    const match = item.name.match(/^\/(\d+)([.-])/);
                    if (!match) continue;
                    const id = match[1];
                    if (!combinedMap[id]) combinedMap[id] = { hits: 0 };
                    combinedMap[id].hits += item.hits?.total ?? 0;
                }
            }
            if (!foundData) consecutiveEmpty++; else consecutiveEmpty = 0;
            page += 10;
        }
        _allStatsCache = combinedMap; saveCachedStats(combinedMap); _statsFetchPromise = null;
        updatePlayCounts(); return combinedMap;
    })();
    return _statsFetchPromise;
}

async function getStats(id) { return (await getAllStats())[String(id)]?.hits ?? 0; }

// Data Export/Import logic 
function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...' : obj;
    if (obj instanceof Uint8Array) return obj.length > maxArrayLen ? `[Uint8Array too large]` : obj;
    if (Array.isArray(obj)) return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    if (obj && typeof obj === 'object') {
        const newObj = {}; for (const key in obj) if (obj.hasOwnProperty(key)) newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
        return newObj;
    }
    return obj;
}

async function saveData() {
    alert("Exporting data. Please do not close the page...");
    const result = { cookies: document.cookie, localStorage: {...localStorage}, sessionStorage: {...sessionStorage}, indexedDB: {}, caches: {} };
    // IndexedDB
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
        if (!dbInfo.name) continue;
        result.indexedDB[dbInfo.name] = {};
        await new Promise((res, rej) => {
            const req = indexedDB.open(dbInfo.name, dbInfo.version);
            req.onerror = () => rej(req.error);
            req.onsuccess = () => {
                const db = req.result; const storeNames = Array.from(db.objectStoreNames);
                if (!storeNames.length) return res();
                const tx = db.transaction(storeNames, "readonly");
                const promises = storeNames.map(storeName => new Promise(r => {
                    const storeReq = tx.objectStore(storeName).getAll();
                    storeReq.onsuccess = () => { result.indexedDB[dbInfo.name][storeName] = sanitizeData(storeReq.result); r(); };
                }));
                Promise.all(promises).then(res);
            };
        });
    }
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/json" }));
    link.download = `gn-math-save-${Date.now()}.json`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

async function loadData(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) data.cookies.split(';').forEach(c => document.cookie = c.trim());
        if (data.localStorage) for (const k in data.localStorage) localStorage.setItem(k, data.localStorage[k]);
        if (data.sessionStorage) for (const k in data.sessionStorage) sessionStorage.setItem(k, data.sessionStorage[k]);
        alert("Data imported successfully! The page will now reload.");
        location.reload();
    };
    reader.readAsText(file);
}
